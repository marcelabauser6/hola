plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Yet Another World Protector, compiled against but never bundled.
    //
    // compileOnly, not implementation: YAWP is AGPL v3 and is the user's own installed copy. Shipping
    // it inside this jar would make this jar a redistribution of their work, which drags in the
    // obligation to carry their source alongside it. Left external, their jar stays the untouched
    // file they downloaded and this mod is just something that calls into it.
    //
    // Its class names are already the official Mojang ones (1.17+ only obfuscates members), so no
    // fg.deobf is needed - javac reads the signatures and the member names never enter our bytecode.
    compileOnly files(yawp_jar)

    // Same jar at runtime, so runClient/runServer can actually load a world with regions in it.
    runtimeOnly files(yawp_jar)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                    : mod_id,
            mod_name                  : mod_name,
            mod_display_name          : mod_display_name,
            mod_version               : mod_version,
            mod_authors               : mod_authors,
            mod_license               : mod_license,
            minecraft_version_range   : minecraft_version_range,
            forge_version_range       : forge_version_range,
            loader_version_range      : loader_version_range,
            yawp_version_range        : yawp_version_range,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    // The AGPL text travels with the binary, which is what mods.toml promises and what the licence
    // itself asks for.
    from('LICENSE')

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_id,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar.finalizedBy('reobfJar')

// Pure-JVM guard for the shape names, the one thing that would break the command in a way that is
// awkward to catch in game: an identifier the completion offers and Brigadier then refuses.
tasks.register('verifyWandShapes', JavaExec) {
    group = 'verification'
    description = 'Checks that every shape name is offerable, parseable and covers a YAWP area type.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.athensmc.fantasticregions.wand.WandShapeStaticTest'
}

tasks.named('check') {
    dependsOn tasks.named('verifyWandShapes')
}
