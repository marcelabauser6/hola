modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/marcelabauser6/hola/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_display_name}"
authors="${mod_authors}"
description='''
Tiendas atendidas por NPC, con precios en Fantastic Cash.

Un mod de Forge para cliente y servidor, pensado para Mohist. El servidor manda: guarda las tiendas con el mundo,
cobra el dinero y decide si un trato puede ocurrir. El cliente aporta el editor a pantalla completa con el que un
administrador monta la tienda.

  Objeto de creacion  - clic derecho en un cofre para elegir el almacen, luego clic derecho en el suelo.
  Agachate + clic     - abre el editor del tendero que tengas delante.
  Clic normal         - abre la ventana de compra.
  /Fskeepers ayuda    - todos los comandos.

Tipos de tienda: administrador (existencias infinitas), venta, compra, trueque y libros.
Cuerpos: cualquier mob que el servidor conozca, un cartel, o ninguno (tienda virtual por comando).

Fantastic Currency es opcional. Si esta instalado, los precios se cobran en Fantastic Cash; si no, las tiendas
siguen funcionando con pagos en articulos.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional, and loaded first when present so the currency API is ready before any shop charges anything.
# Declared as a dependency rather than merely detected, so Forge orders the two mods instead of leaving it to
# whichever happens to initialise first.
[[dependencies.${mod_id}]]
    modId="athens_coins"
    mandatory=false
    versionRange="[5.0,)"
    ordering="AFTER"
    side="BOTH"
