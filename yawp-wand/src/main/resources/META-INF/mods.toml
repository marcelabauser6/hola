modLoader="javafml"
loaderVersion="${loader_version_range}"

# AGPL v3, and it has to be: this mod is built against Yet Another World Protector, which is AGPL v3.
# The full licence text ships in this jar as LICENSE.
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_display_name}"
authors="${mod_authors}"
credits="An add-on to Yet Another World Protector by Z0rdak (AGPL v3)"

# Server-side only, so a client without this mod can still connect. There is no custom item, no
# packet and no rendering here - the outline is particles, which any vanilla client draws.
displayTest="IGNORE_ALL_VERSION"

description='''
An add-on to YAWP: a blaze rod for preselecting the area of a region.

  /yawp wand cuboide    a box, marking two opposite corners
  /yawp wand esfera     a ball, marking the centre and a block on the edge
  /yawp wand circulo    a vertical cylinder, marking the centre and the edge
  /yawp wand poligono   a many-sided footprint, marking each vertex
  /yawp wand prisma     a polygon with height

The perimeter is drawn in the world while the rod is held, so the extent is visible before the
region exists. The region is then created with YAWP's own create command, which picks the
preselection straight off the rod.

Nothing of YAWP's is modified, replaced or removed. Install on the server only, next to YAWP.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Hard dependency, loaded first: the rod carries YAWP's marker data and there is nothing to preselect
# for without it. AFTER so YAWP's command tree exists by the time /yawp wand is hung off it.
[[dependencies.${mod_id}]]
    modId="yawp"
    mandatory=true
    versionRange="${yawp_version_range}"
    ordering="AFTER"
    side="SERVER"
