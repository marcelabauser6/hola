plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_display_name       : mod_display_name,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_license            : mod_license,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_id,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar.finalizedBy('reobfJar')

/**
 * The overlap guard.
 *
 * <p>Runs on a plain JVM as part of `check`, so a screen that would draw one control over another fails the
 * build rather than being found by looking at it. Every band, the help area, every list row and every grid cell
 * is checked at nine window sizes.</p>
 */
tasks.register('verifyEditorLayout', JavaExec) {
    group = 'verification'
    description = 'Checks the editor screens for overlaps and unclickable rows.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.athensmc.shopeditor.client.layout.EditorLayoutStaticTest'
}

/** Guard for the price field: what an admin types becoming money. */
tasks.register('verifyTradeLines', JavaExec) {
    group = 'verification'
    description = 'Checks price parsing, formatting and trade validation.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.athensmc.shopeditor.trade.TradeLineStaticTest'
}

tasks.named('check') {
    dependsOn tasks.named('verifyEditorLayout')
    dependsOn tasks.named('verifyTradeLines')
}
